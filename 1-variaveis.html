<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Variaveis</title>
</head>
<body>
    <script>
        //var
        var nome = "felipe";
        console.log(nome);
        
        var nome = "Lucas"
        console.log(nome);

        nome = "aspas"
        console.log(nome);


        //let
        let idade = 18;
        console.log(idade);

        idade = 19;
        console.log(idade);


        //const
        const CIDADE = "São Paulo";
        console.log(CIDADE);

        //STRING
        let string = "Sou um texto";
        console.log(string);

        //BOOLEAN
        let maiorDeIdade = true;
        let menorDeIdade = false;

        console.log(maiorDeIdade);
        console.log(typeof maiorDeIdade);

        //NUMBER
        idade = 18;
        let preco = 8.21;
        console.log(typeof preco);
    </script>
</body>
</html>
