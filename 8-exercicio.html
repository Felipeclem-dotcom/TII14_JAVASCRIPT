<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>
        let num = parseInt(prompt("Escolha um número: "));
        let operador = prompt("Digite o operador (+, -, *, /): ")

        switch(operador) {
            case "+":
                soma();
                break;
            case "-":
                sub();
                break;
            case "*":
                mult();
                break;
            case "/":
                div();
                break;
        }
        
        
        function soma() {
        for(i = 0; i <= 10; i++) {
            console.log(`${i} + ${num} = ${num + i}`)
        }

        }

        function sub() {
        for(i = 0; i <= 10; i++) {
            console.log(`${i} - ${num} = ${num - i}`)
        }
        
        }

        function mult() {
        for(i = 0; i <= 10; i++) {
            console.log(`${i} x ${num} = ${num * i}`)
        }
        
        }

        function div() {
        for(i = 0; i <= 10; i++) {
            console.log(`${i} / ${num} = ${num / i}`)
        }
        
        }
    </script>
</body>
</html>
