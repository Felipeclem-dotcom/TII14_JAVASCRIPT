<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <style>
        body {
            background-color: rgb(66, 66, 66);
        }
    </style>

    <script>
    //    console.log(new Date(1991, 9, 13, 19, 5));
       
    //    console.log(new Date("1991-10-25T08:11:25Z"));

       const DATA = new Date();
       console.log(DATA.getFullYear());//ano atual
       console.log(DATA.getMonth());//mes atual
       console.log(DATA.getDate());//dia do mes
       console.log(DATA.getDay());//dia da semana (0,1,2,3,4,5,6)
       console.log(DATA.getHours());//horario atual
       console.log(DATA.getMinutes());//minuto atual
       console.log(DATA.getSeconds());//segundo atual
       console.log(DATA.getMilliseconds());//milisegundo atual
       console.log(DATA.getTime());//retorna os milesegundos desde primeiro de janeiro de 1970 - "Unix Epoch"
    </script>
</body>
</html>
