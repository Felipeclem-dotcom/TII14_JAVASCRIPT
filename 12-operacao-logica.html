<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>
        //Operadores logicos
        //Esses operadores sao usados para combinar expressoes logicas

        //operador logico &&: retorma (true) se ambas as expressoes forem verdadeiras

        //operador logico ||: retprma (true) se pelo menos uma das expressoes forem verdadeiras

        let nome = true;
        let senha = true;

        let resultado = nome && senha;
        console.log(resultado)//true

        //ou
        nome = true;
        senha = false;

        resultado = nome || senha;
        console.log(resultado)//true
    </script>
</body>
</html>
